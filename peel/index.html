<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Heelarious: The Great Flake-Off — Nasty World</title>
<meta name="description" content="Peel your own dry foot skin while absorbed in something else. 18+ crude humor.">
<meta name="theme-color" content="#2b1d3a">
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <button id="pauseBtn" class="round" aria-label="Pause">II</button>
  <button id="soakBtn" class="pill" aria-label="Soak">🛁 Soak <b id="soakN">1</b></button>
</div>
<div id="title" class="screen">
  <canvas id="mascot" width="320" height="300"></canvas>
  <h1 class="logo"><span class="l1">HEEL</span><span class="l2">ARIOUS</span><small>The Great Flake-Off</small></h1>
  <p class="tag">Nose in a book. Hand on his foot. Peel the crust before anyone catches him.</p>
  <div class="btns">
    <button id="playBtn" class="big">Start Picking</button>
    <button id="shopBtn1" class="mid">Tools</button>
    <a class="mid ghost" id="backHub1" href="../">← Back to Nasty World</a>
  </div>
  <p class="age">18+ · Crude humor</p>
</div>
<div id="select" class="screen hidden"><h2>Pick a Scene</h2><div id="custList"></div>
  <div class="btns row"><button id="shopBtn2" class="mid">Tools</button><button id="selBack" class="mid ghost">Title</button></div><p class="coins">⭐ <b class="starN">0</b></p></div>
<div id="intro" class="screen hidden"><div class="card"><div id="introTxt"></div><button id="introGo" class="big">Start peeling</button></div></div>
<div id="shop" class="screen hidden"><h2>Tools</h2><p class="coins">🪙 <b class="coinN">0</b></p><div id="shopList"></div><div class="btns"><button id="shopDone" class="mid">Done</button></div></div>
<div id="pause" class="screen hidden"><div class="card"><h2>Paused</h2><div class="btns">
  <button id="resume" class="big">Resume</button><button id="restart" class="mid">Restart foot</button><button id="quit" class="mid">Scene list</button><a class="mid ghost" href="../">← Back to Nasty World</a></div></div></div>
<div id="result" class="screen hidden"><div class="card"><h2 id="resTitle"></h2><div id="resBody"></div>
  <img id="shareImg" alt="Share card" class="hidden"><a id="shareDl" class="mid hidden" download="heelarious-flake.png">Save share card</a>
  <div class="btns"><button id="resNext" class="big">Next scene →</button><button id="resRetry" class="mid">Retry</button><a class="mid ghost" href="../">← Back to Nasty World</a></div></div></div>
<script src="game.js"></script>
</body></html>
